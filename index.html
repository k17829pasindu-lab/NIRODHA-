<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ayurveda">
<title>ආයුර්වේද සාප්පු කළමනාකරු</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f4ec;--card:#fff;--ink:#1d2a1f;--mute:#667366;--line:#dde3d4;--green:#2f5d3a;--onGreen:#fff;--gold:#e0a100;--red:#b3261e;--warn:#fff3d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261d;--ink:#e8efe6;--mute:#93a493;--line:#2c3a2e;--green:#6fb27f;--onGreen:#0f1a11;--gold:#f0b92e;--red:#ff8a80;--warn:#3a3112}}
:root[data-theme="dark"]{--bg:#121a14;--card:#1b261d;--ink:#e8efe6;--mute:#93a493;--line:#2c3a2e;--green:#6fb27f;--onGreen:#0f1a11;--gold:#f0b92e;--red:#ff8a80;--warn:#3a3112}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Sinhala",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap;padding:11px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--green);color:var(--onGreen);border-color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.btn{padding:12px 14px;border:0;border-radius:8px;background:var(--green);color:var(--onGreen);font:inherit;font-weight:600;width:100%;margin-top:10px}
.btn.alt{background:transparent;color:var(--green);border:1px solid var(--green);width:auto;margin:0;padding:8px 12px}
.btn.del{background:transparent;color:var(--red);border:1px solid var(--line);width:auto;margin:0;padding:8px 10px}
.lang{width:auto;margin:0;padding:8px 12px;background:var(--gold);color:#1d2a1f}
.line{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}.line small{color:var(--mute);display:block}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin-top:10px}
.low{background:var(--warn);border-radius:8px;padding:9px 8px}
.tag{font-size:12px;color:var(--red);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:14px 0}
.pay{display:flex;gap:6px;margin-top:6px}
.pay button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit}
.pay button.on{border-color:var(--gold);background:var(--gold);color:#1d2a1f;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.sm2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.sm2 input{width:72px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;color:var(--ink);font:inherit;position:relative;cursor:pointer}
.tile .ph{width:100%;aspect-ratio:1;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tn{padding:6px 8px 0;font-size:13px;font-weight:600;line-height:1.3;min-height:2.7em}
.tile .tp{padding:0 8px 8px;font-size:12px;color:var(--mute)}
.tile.out{opacity:.4;pointer-events:none}
.tile .badge{position:absolute;top:6px;right:6px;background:var(--gold);color:#1d2a1f;border-radius:12px;min-width:26px;padding:1px 7px;font-weight:700;font-size:14px;text-align:center}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--line);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qb{display:flex;gap:6px;align-items:center}.qb button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:18px}
.sugi{display:flex;justify-content:space-between;gap:8px;width:100%;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;text-align:left}.sugi small{color:var(--mute)}
.sugsel{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--warn);font-weight:600}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;gap:6px;margin:14px 0;text-align:center}.eq .l{font-size:12px;color:var(--mute);display:block;margin-bottom:4px}.eq b{display:block;font-size:26px;padding:6px 0}.eq .op{font-size:26px;padding-bottom:10px}.eq input{text-align:center;font-size:20px;padding:10px 4px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.18);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:15}
#bar .in{max-width:640px;margin:0 auto}#bar .barrow{display:flex;gap:10px;align-items:center;margin-top:8px}#bar .barrow .btn{margin:0;width:auto;flex:0 0 46%;padding:14px}
#bar .pay{margin-top:0}#bar b{font-size:20px;display:block}#bar small{color:var(--mute)}
body.has-bar main{padding-bottom:190px}body.has-bar .toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
table.rt{width:100%;border-collapse:collapse;font-size:14px}.rt th,.rt td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}.rt th:first-child,.rt td:first-child{text-align:left}.rt tfoot td{font-weight:700;border-top:2px solid currentColor;border-bottom:0}
#rcpt{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:20}
.sheet{background:#fff;color:#000;width:100%;max-width:320px;padding:16px;border-radius:8px;font-size:14px}
.sheet .c{text-align:center}.sheet hr{border:0;border-top:1px dashed #000;margin:8px 0}
.sheet .r{display:flex;justify-content:space-between;gap:8px}
.rbtn{display:flex;gap:8px;margin-top:12px}.rbtn .btn{margin:0}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{position:static;background:none;padding:0;display:block}.sheet{max-width:none;padding:0}.rbtn{display:none}}
</style>
</head>
<body>
<main>
<div class="top"><h1 data-i18n="title"></h1><button class="btn lang" id="langBtn"></button></div>
<div class="stats">
  <div class="stat"><b id="sToday"></b><span data-i18n="today"></span></div>
  <div class="stat"><b id="sBills"></b><span data-i18n="billsToday"></span></div>
  <div class="stat"><b id="sLow"></b><span data-i18n="lowStock"></span></div>
</div>
<div id="bkWarn" class="card low" hidden style="cursor:pointer;font-weight:600"></div>
<div class="tabs">
  <button data-t="sell" class="on" data-i18n="sell"></button>
  <button data-t="recv" data-i18n="recv"></button>
  <button data-t="stock" data-i18n="stock"></button>
  <button data-t="report" data-i18n="report"></button>
  <button data-t="check" data-i18n="check"></button>
</div>

<section id="sell">
  <div class="card">
    <h2 data-i18n="newBill"></h2>
    <div class="row"><input id="pSearch" type="search"><button class="btn" id="scanSell" data-i18n="scan" style="flex:0 0 auto;width:auto;margin:0"></button></div>
    <div class="grid" id="grid" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <div id="cart"></div>
    <label for="disc" data-i18n="disc"></label><input id="disc" type="number" min="0" value="0" inputmode="decimal">
    <label data-i18n="payment"></label>
    <div class="pay" id="pay"><button class="on" data-p="cash" data-i18n="cash"></button><button data-p="card" data-i18n="card"></button><button data-p="bank" data-i18n="bank"></button></div>
    <div class="tot"><span data-i18n="total"></span><span id="grand"></span></div>
    <button class="btn" id="save" data-i18n="save"></button>
  </div>
</section>

<section id="stock" hidden>
  <div class="card">
    <h2 data-i18n="addProd"></h2>
    <label for="nName" data-i18n="name"></label><input id="nName" autocomplete="off"><div id="sug"></div>
    <div class="row">
      <div><label for="nPrice" data-i18n="price"></label><input id="nPrice" type="number" min="0" inputmode="decimal"></div>
      <div><label for="nStock" data-i18n="openStock"></label><input id="nStock" type="number" min="0" inputmode="numeric"></div>
      <div><label for="nLow" data-i18n="alert"></label><input id="nLow" type="number" min="0" value="5" inputmode="numeric"></div>
    </div>
    <label for="nCode" data-i18n="code"></label><div class="row"><input id="nCode"><button class="btn alt" id="scanNew" data-i18n="scan" style="flex:0 0 auto"></button></div>
    <label for="nImg" data-i18n="photo"></label><input id="nImg" type="file" accept="image/*">
    <button class="btn" id="addProd" data-i18n="addBtn"></button>
  </div>
  <div class="card"><h2 data-i18n="expTitle"></h2><div class="row"><button class="btn" id="expPdf" data-i18n="expPdf" style="margin:0"></button><button class="btn alt" id="expCsv" data-i18n="expCsv" style="margin:0"></button></div></div>
  <div class="card"><h2 data-i18n="bkTitle"></h2><small data-i18n="bkHint" style="color:var(--mute);display:block"></small><div id="bkInfo" style="margin:8px 0;font-size:14px"></div><button class="btn" id="bkSave" data-i18n="bkSave"></button><label class="btn alt" style="display:block;text-align:center;width:100%;margin-top:8px;font-size:16px;padding:12px;color:var(--green)"><span data-i18n="bkRestore"></span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div>
  <div class="card"><h2 data-i18n="toBuy"></h2><div id="buyList"></div><button class="btn" id="printBuy" data-i18n="printBuy"></button></div>
  <div class="card"><h2 data-i18n="current"></h2><small data-i18n="hint" style="color:var(--mute);display:block;margin-bottom:6px"></small><div id="plist"></div></div>
  <div class="card">
    <h2 data-i18n="shopInfo"></h2>
    <label for="shopName" data-i18n="shopName"></label><input id="shopName">
    <label for="shopTel" data-i18n="shopTel"></label><input id="shopTel" inputmode="tel">
  </div>
</section>

<section id="report" hidden>
  <div class="card">
    <label for="rDate" data-i18n="date"></label><input id="rDate" type="date">
    <div class="stats" style="margin:12px 0 0">
      <div class="stat"><b id="rTotal"></b><span data-i18n="totalSales"></span></div>
      <div class="stat"><b id="rBills"></b><span data-i18n="bills"></span></div>
      <div class="stat"><b id="rItems"></b><span data-i18n="itemsSold"></span></div>
    </div>
    <div id="rPay" style="margin-top:10px;color:var(--mute);font-size:14px"></div>
    <button class="btn" id="printDay" data-i18n="printDay"></button>
  </div>
  <div class="card"><h2 data-i18n="sold"></h2><div id="rSold"></div></div>
  <div class="card"><h2 data-i18n="bills"></h2><div id="rBillsList"></div></div>
</section>
<section id="recv" hidden>
  <div class="card"><h2 data-i18n="recvTitle"></h2>
    <div class="row"><input id="rvSearch" type="search" autocomplete="off"><button class="btn" id="rvScan" data-i18n="scan" style="flex:0 0 auto;width:auto;margin:0"></button></div>
    <div id="rvList" style="margin-top:8px;max-height:260px;overflow:auto"></div>
    <button class="btn alt" id="rvNewItem" data-i18n="rvNewItem" style="width:100%;margin-top:10px"></button>
  </div>
  <div class="card" id="rvCard" hidden>
    <div style="display:flex;gap:10px;align-items:center"><div class="thumb" id="rvImg"></div><div><b id="rvName"></b><small id="rvSub" style="color:var(--mute);display:block"></small></div></div>
    <div class="eq"><div><span class="l" data-i18n="curStock"></span><b id="rvCur">0</b></div><span class="op">+</span><div><span class="l" data-i18n="addingN"></span><input id="rvQty" type="number" min="1" inputmode="numeric"></div><span class="op">=</span><div><span class="l" data-i18n="newStock"></span><b id="rvNew" style="color:var(--green)">0</b></div></div>
    <button class="btn" id="rvSave" data-i18n="rvSave"></button>
  </div>
  <div class="card"><h2 data-i18n="rvRecent"></h2><div id="rvLog"></div></div>
</section>
<section id="check" hidden>
  <div class="card"><h2 data-i18n="check"></h2><small data-i18n="checkHint" style="color:var(--mute);display:block;margin-bottom:8px"></small><div id="cList"></div>
  <button class="btn" id="applyCheck" data-i18n="applyCheck"></button>
  <button class="btn alt" id="lastCheck" style="width:100%;margin-top:8px" data-i18n="lastCheck"></button></div>
</section>
</main>

<div id="bar" hidden><div class="in"><div class="pay" id="pay2"><button class="on" data-p="cash" data-i18n="cash"></button><button data-p="card" data-i18n="card"></button><button data-p="bank" data-i18n="bank"></button></div><div class="barrow"><div id="barTxt" style="flex:1;cursor:pointer"><small><span id="barCnt"></span> ▲</small><b id="barTot"></b></div><button class="btn" id="save2" data-i18n="save"></button></div></div></div>
<div id="scan" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:25;display:flex;flex-direction:column;justify-content:flex-start;overflow:auto;padding:16px;gap:12px"><div id="scanMsg" style="color:#fff;text-align:center"></div><div id="qr-reader" style="width:100%;max-width:420px;margin:0 auto;background:#000"></div>
<div id="cropBox" hidden style="max-width:420px;margin:0 auto;width:100%"><canvas id="cropCv" style="display:block;margin:0 auto;touch-action:none;border-radius:8px"></canvas><div class="row" style="margin-top:10px"><button class="btn" id="cropGo" data-i18n="cropRead" style="margin:0"></button><button class="btn alt" id="cropCancel" data-i18n="cancel" style="margin:0;background:var(--card)"></button></div></div><div class="row" style="max-width:420px;margin:0 auto;width:100%"><input id="scanManual" inputmode="text"><button class="btn" id="scanOk" style="flex:0 0 auto;width:auto;margin:0">OK</button></div><div id="qr-tmp" hidden></div><label class="btn alt" style="display:block;text-align:center;width:100%;max-width:420px;margin:0 auto;padding:12px;font-size:16px;background:var(--card);color:var(--green)"><span data-i18n="takePhoto"></span><input type="file" id="scanPhoto" accept="image/*" capture="environment" hidden></label><button class="btn" id="scanClose" data-i18n="close" style="max-width:420px;margin:0 auto"></button></div>
<div id="rcpt" hidden><div class="sheet"><div id="rbody"></div>
<div class="rbtn"><button class="btn" id="doPrint" data-i18n="print"></button><button class="btn alt" id="closeR" data-i18n="close"></button></div></div></div>
<div class="toast" id="toast"></div>

function addTo(pid,d){

async function decodeFile(f){
  if(window.BarcodeDetector){try{const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r[0])return r[0].rawValue}catch(e){}}
  try{await loadLib()}catch(e){throw "lib"}

function jpegPdf(jp,PW,PH){

  const push=b=>{const u=typeof b==="string"?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+" 0 obj\n");fn();push("\nendobj\n")};
  const n=jp.length,w=595,h=842;
  push("%PDF-1.4\n");
  obj(1,()=>push("<< /Type /Catalog /Pages 2 0 R >>"));
  obj(2,()=>push("<< /Type /Pages /Kids ["+jp.map((_,i)=>(3+i*3)+" 0 R").join(" ")+"] /Count "+n+" >>"));
  jp.forEach((j,i)=>{const p=3+i*3,cs="q "+w+" 0 0 "+h+" 0 0 cm /Im"+i+" Do Q";
    obj(p,()=>push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+w+" "+h+"] /Resources << /XObject << /Im"+i+" "+(p+2)+" 0 R >> >> /Contents "+(p+1)+" 0 R >>"));
    obj(p+1,()=>push("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"));
    obj(p+2,()=>{push("<< /Type /XObject /Subtype /Image /Width "+PW+" /Height "+PH+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.length+" >>\nstream\n");push(j);push("\nendstream")});
  });
  const total=3+n*3,xr=len;
  push("xref\n0 "+total+"\n0000000000 65535 f \n");
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}

    }
  }catch(e){return toast(t("bkFail"))}
  saveOut("stock-"+today()+".pdf",jpegPdf(jp,W,H));
};
function renderBk(){
  $("bkInfo").textContent=S.lastBackup?t("lastBk")+" "+new Date(S.lastBackup).toLocaleString("en-GB"):t("noBk");
  const old=!S.lastBackup||Date.now()-S.lastBackup>7*864e5;
  $("bkWarn").hidden=!(old&&(S.products.length||S.sales.length));$("bkWarn").textContent=t("bkWarn");
}
$("bkWarn").onclick=()=>document.querySelector('[data-t="stock"]').click();
$("bkSave").onclick=async()=>{
  const data=JSON.stringify({app:"ayur-shop",v:1,saved:Date.now(),data:S}),fn="ayurveda-backup-"+today()+".json";
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl)await dl.save({filename:fn,data});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(e&&e.code==="declined")return;return toast(t("bkFail"))}
  S.lastBackup=Date.now();save();toast(t("bkOk"));render();
};
$("restoreFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text()),d=j.data||j;if(!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;
    S=Object.assign({products:[],sales:[],shop:{name:"",tel:""}},d);S.shop=S.shop||{name:"",tel:""};save();toast(t("restored"));render()}
  catch(err){toast(t("badFile"))}
  e.target.value="";
};
function renderCheck(){
  $("cList").innerHTML=S.products.length?`<table class="rt"><thead><tr><th>${t("product")}</th><th>${t("system")}</th><th>${t("counted")}</th><th>${t("diff")}</th></tr></thead><tbody>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td><input type="number" min="0" inputmode="numeric" data-c="${p.id}" style="width:70px;padding:6px"></td><td id="d_${p.id}">-</td></tr>`).join("")}</tbody></table>`:`<div class="empty">${t("noProdList")}</div>`;
}
$("cList").oninput=e=>{const id=e.target.dataset.c;if(!id)return;const p=S.products.find(x=>x.id===id),v=e.target.value,c=$("d_"+id);if(v===""){c.textContent="-";c.style.color="";return}const d=Math.floor(+v)-p.stock;c.textContent=(d>0?"+":"")+d;c.style.color=d===0?"":d<0?"var(--red)":"var(--green)"};
function showCheck(r){
  const d=new Date(r.ts),tv=r.rows.reduce((a,x)=>a+(x.cnt-x.sys)*x.price,0),sg=n=>(n>0?"+":"")+n;
  $("rbody").innerHTML=`<div class="c"><b>${esc(S.shop.name||t("title"))}</b><br>${t("check")} ${d.toLocaleDateString("en-GB")} ${d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div><hr><table class="rt"><thead><tr><th>${t("product")}</th><th>${t("system")}</th><th>${t("counted")}</th><th>${t("diff")}</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.sys}</td><td>${x.cnt}</td><td>${sg(x.cnt-x.sys)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="3">${t("diffVal")}</td><td>${tv>0?"+":""}${inr(tv)}</td></tr></tfoot></table>`;
  $("rcpt").hidden=false;
}
$("applyCheck").onclick=()=>{
  const cs=[...document.querySelectorAll("[data-c]")].filter(i=>i.value!=="").map(i=>({p:S.products.find(x=>x.id===i.dataset.c),c:Math.max(0,Math.floor(+i.value))}));
  if(!cs.length)return toast(t("needRe"));
  const rec={ts:Date.now(),rows:cs.map(({p,c})=>({name:p.name,price:p.price,sys:p.stock,cnt:c}))};
  cs.forEach(({p,c})=>p.stock=c);S.checks=(S.checks||[]).concat(rec).slice(-30);save();toast(t("upd"));render();showCheck(rec);
};
$("lastCheck").onclick=()=>{const c=S.checks||[];if(!c.length)return toast(t("noCheck"));showCheck(c[c.length-1])};
$("printBuy").onclick=()=>{$("rbody").innerHTML=`<div class="c"><b>${esc(S.shop.name||t("title"))}</b><br>${t("toBuy")}</div><hr>`+$("buyList").innerHTML;$("rcpt").hidden=false};
$("doPrint").onclick=()=>window.print();

function renderStock(){
  const nb=S.products.filter(p=>p.stock<p.low);
  $("buyList").innerHTML=nb.length?`<table class="rt"><thead><tr><th>${t("product")}</th><th>${t("real")}</th><th>${t("must")}</th><th>${t("buy")}</th></tr></thead><tbody>${nb.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${p.low}</td><td><b>${p.low-p.stock}</b></td></tr>`).join("")}</tbody></table>`:`<div class="empty">${t("allOk")}</div>`;
  $("plist").innerHTML=S.products.length?S.products.map(p=>`<div class="line ${p.stock<p.low?"low":""}"><div style="display:flex;gap:8px;align-items:center"><label class="thumb" style="margin:0;cursor:pointer">${p.img?`<img src="${p.img}" alt="" style="width:44px;height:44px;object-fit:cover">`:"📷"}<input type="file" accept="image/*" data-img="${p.id}" hidden></label><div>${esc(p.name)}<small>${inr(p.price)} · ${t("real")} ${p.stock} · ${t("must")} ${p.low} ${p.code?"· #"+esc(p.code)+" ":""}${p.stock<p.low?`<span class="tag">${t("low")}</span>`:""}</small></div></div><div class="sm2"><input type="number" min="1" placeholder="+" id="r_${p.id}" inputmode="numeric"><button class="btn alt" data-re="${p.id}">+ ${t("add")}</button><button class="btn alt" data-set="${p.id}">${t("setR")}</button><button class="btn alt" data-must="${p.id}">${t("setM")}</button><button class="btn alt" data-code="${p.id}">📷 ${t("code")}</button><button class="btn del" data-del="${p.id}">✕</button></div></div>`).join(""):`<div class="empty">${t("noProdList")}</div>`;
}
$("plist").onclick=e=>{
  const re=e.target.dataset.re,del=e.target.dataset.del,st=e.target.dataset.set,mu=e.target.dataset.must;
  if(e.target.dataset.code){const id=e.target.dataset.code;return openScan(c=>{c=c.trim();const o=byCode(c);if(o&&o.id!==id)return toast(t("dupCode")+" "+o.name);S.products.find(x=>x.id===id).code=c;save();closeScan();toast(t("codeGot")+" "+c);render()})}
  if(st||mu){const id=st||mu,v=$("r_"+id).value;if(v==="")return toast(t("needRe"));const p=S.products.find(x=>x.id===id),n=Math.max(0,Math.floor(+v));if(st)p.stock=n;else p.low=n;save();toast(t("upd"));return render()}
  if(re){const q=Math.floor(+$("r_"+re).value);if(!(q>0))return toast(t("needRe"));S.products.find(p=>p.id===re).stock+=q;save();toast(t("upd"));render()}
  if(del){if(e.target.dataset.sure){S.products=S.products.filter(p=>p.id!==del);save();render()}else{e.target.dataset.sure=1;e.target.textContent=t("sure");setTimeout(()=>{e.target.dataset.sure="";e.target.textContent="✕"},2500)}}
};
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sm=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=Math.min(240,sm);c.getContext("2d").drawImage(im,(im.width-sm)/2,(im.height-sm)/2,sm,sm,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.7))};im.onerror=()=>res("");im.src=r.result};r.onerror=()=>res("");r.readAsDataURL(f)})}
$("plist").onchange=async e=>{const id=e.target.dataset.img,f=e.target.files&&e.target.files[0];if(!id||!f)return;const p=S.products.find(x=>x.id===id);p.img=await shrink(f);save();render()};
$("addProd").onclick=async()=>{
  const n=$("nName").value.trim(),pr=+$("nPrice").value,f=$("nImg").files[0];
  if(selPid){const p=S.products.find(x=>x.id===selPid),q=Math.floor(+$("nStock").value);if(!p)return;if(!(q>0))return toast(t("needRe"));p.stock+=q;const c=$("nCode").value.trim();if(c&&!p.code&&!byCode(c))p.code=c;if($("nPrice").value!==""&&+$("nPrice").value!==p.price)p.price=+$("nPrice").value;if(f&&!p.img)p.img=await shrink(f);save();clearForm();toast(t("upd"));return render()}
  if(!n||$("nPrice").value==="")return toast(t("needNP"));
  const nc=$("nCode").value.trim(),dup=nc&&byCode(nc);if(dup)return toast(t("dupCode")+" "+dup.name);
  if(S.products.some(p=>p.name.trim().toLowerCase()===n.toLowerCase()))return toast(t("nameExists"));
  S.products.push({id:uid(),name:n,price:pr,code:nc,img:f?await shrink(f):"",stock:Math.floor(+$("nStock").value)||0,low:Math.floor(+$("nLow").value)||0});
  save();["nName","nPrice","nStock","nImg","nCode"].forEach(i=>$(i).value="");toast(t("added"));render();
};
$("printDay").onclick=()=>{$("rbody").innerHTML=`<div class="c"><b>${esc(S.shop.name||t("title"))}</b><br>${t("report")} ${$("rDate").value}</div><hr>`+$("rSold").innerHTML+`<hr><div class="r"><span>${t("bills")}</span><span>${$("rBills").textContent}</span></div><div>${esc($("rPay").textContent)}</div>`;$("rcpt").hidden=false};
$("shopName").oninput=()=>{S.shop.name=$("shopName").value;save()};
$("shopTel").oninput=()=>{S.shop.tel=$("shopTel").value;save()};

$("rDate").value=today();$("rDate").onchange=renderReport;
function renderReport(){
  const d=$("rDate").value||today(),ss=S.sales.filter(s=>s.date===d).sort((a,b)=>b.ts-a.ts);
  $("rTotal").textContent=inr(ss.reduce((a,s)=>a+s.total,0));
  $("rBills").textContent=ss.length;
  $("rItems").textContent=ss.reduce((a,s)=>a+s.lines.reduce((x,l)=>x+l.qty,0),0);
  const by={};ss.forEach(s=>by[s.pay]=(by[s.pay]||0)+s.total);
  $("rPay").textContent=Object.keys(by).map(k=>payL(k)+" "+inr(by[k])).join("  |  ");
  const m={};ss.forEach(s=>s.lines.forEach(l=>{m[l.name]=m[l.name]||{q:0,a:0};m[l.name].q+=l.qty;m[l.name].a+=l.qty*l.price}));
  const ks=Object.keys(m).sort((a,b)=>m[b].a-m[a].a);
  const dsc=ss.reduce((a,s)=>a+s.disc,0);
  $("rSold").innerHTML=ks.length?`<table class="rt"><thead><tr><th>${t("product")}</th><th>${t("qty")}</th><th>${t("amount")}</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${m[k].q}</td><td>${inr(m[k].a)}</td></tr>`).join("")}${dsc?`<tr><td>${t("disc").replace(/ \(.*\)/,"")}</td><td></td><td>- ${inr(dsc)}</td></tr>`:""}</tbody><tfoot><tr><td>${t("totalSales")}</td><td>${ks.reduce((a,k)=>a+m[k].q,0)}</td><td>${inr(ss.reduce((a,s)=>a+s.total,0))}</td></tr></tfoot></table>`:`<div class="empty">${t("noSales")}</div>`;
  $("rBillsList").innerHTML=ss.length?ss.map(s=>`<div class="line"><div>${new Date(s.ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})} · ${payL(s.pay)}<small>${s.lines.map(l=>esc(l.name)+" ×"+l.qty).join(", ")}</small></div><div><b>${inr(s.total)}</b> <button class="btn alt" data-pr="${s.id}">🖨</button> <button class="btn del" data-void="${s.id}">${t("void")}</button></div></div>`).join(""):`<div class="empty">${t("noSales")}</div>`;
}
$("rBillsList").onclick=e=>{
  const pr=e.target.dataset.pr,id=e.target.dataset.void;
  if(pr)return showReceipt(S.sales.find(x=>x.id===pr));
  if(!id)return;
  if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent=t("sure");return}
  const s=S.sales.find(x=>x.id===id);
  s.lines.forEach(l=>{const p=S.products.find(x=>x.id===l.pid);if(p)p.stock+=l.qty});
  S.sales=S.sales.filter(x=>x.id!==id);save();toast(t("voided"));render();
};
i18n();render();
</script>
<script>
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
